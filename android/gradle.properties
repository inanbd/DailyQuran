org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation computes plugin source paths relative to the
# project directory. When the project and the pub cache sit on different Windows
# drives (project on E:, pub cache on C:), that relative path cannot be formed
# and the compile task fails with "Could not close incremental caches".
kotlin.incremental=false
